services:
  lemonade:
    image: ghcr.io/lemonade-sdk/lemonade-server:latest
    container_name: lemonade-server
    ports:
      - "13305:13305"
    volumes:
      - lemonade-cache:/root/.cache/huggingface
      - lemonade-llama:/opt/lemonade/llama
      - lemonade-recipe:/root/.cache/lemonade
    environment:
      - LEMONADE_LLAMACPP=cpu # Sticking to CPU for Laptop 1 execution loops
      - LEMONADE_HOST=0.0.0.0 # Forces container to listen globally to internal services
      - LEMONADE_ALLOW_ORIGINS=* # CRITICAL: Bypasses CORS security blocks on your web app browser
    networks:
      - localomni-net
    restart: unless-stopped

