packages:
  - apps/*
  - packages/*
  - tools/*

catalogMode: prefer

catalog:
  "@stylexjs/unplugin": ^0.18.3
  "@types/node": ^25.9.2
  typescript: ^6.0.3
  vite: 8.0.16
  vitest: 4.1.8
  vite-plus: ^0.1.24
  "@react-router/node": "7.17.0"
  "@react-router/serve": "7.17.0"
  "@react-router/dev": "7.17.0"
  "@types/react": "^19.2.17"
  "@types/react-dom": "^19.2.3"
  "isbot": "^5.1.41"
  "react": "^19.2.7"
  "react-dom": "^19.2.7"
  "react-router": "7.17.0"
  "@typescript-eslint/utils": ^8.60.1
  eslint: ^10.4.1
  vite-plugin-babel: ^1.6.0
  playwright-core: ^1.61.1
overrides:
  vite: "catalog:"
  vitest: "catalog:"
peerDependencyRules:
  allowAny:
    - vite
    - vitest
  allowedVersions:
    vite: "*"
    vitest: "*"
minimumReleaseAgeExclude:
  - "@react-router/dev@7.17.0"
  - "@react-router/express@7.17.0"
  - "@react-router/node@7.17.0"
  - "@react-router/serve@7.17.0"
  - react-router@7.17.0
